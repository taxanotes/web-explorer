name: 'Taxanotes import'
description: 'Migrations and source plugins that bring taxa into Taxanotes: the live Scratchpads (Drupal 7) database track. Instance-specific values (which vocabulary, which database) come from settings, not from this module.'
type: module
package: Taxanotes
# FetchAs (Drupal\Core\Database\Statement\FetchAs) and the #[MigrateSource]
# attribute exist from core 11.2.
core_version_requirement: ^11.2
dependencies:
  - drupal:migrate
  - drupal:node
