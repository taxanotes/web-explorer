# The Scratchpads main-menu entries of the migrated pages and blog entries,
# and of the blog listing: one menu_link_content item in the D11 main menu
# per D7 main-menu link to a page or blog node, pointing at the migrated
# node (entity:node/<nid>, through the page and blog migrations by uuid; a
# link to a node that was not migrated is skipped), and per D7 link to the
# blog listing (`blog`, "Blogs" / "Mormyrid Blog"), pointing at /blog (the
# listing of recipes/taxanotes_pages; internal:/blog). The title is the
# link's own (Mormyrids' "Notes" for the page "Notes on our classification &
# how to cite"), the weight the D7 weight + 50 (see the source plugin),
# disabled links stay disabled. Keyed on the D7 mlid; the D11 ids are fresh.
id: taxanotes_d7_menu_link
label: 'Scratchpads (Drupal 7) main-menu links of pages, blog entries and the blog listing'
migration_group: taxanotes
migration_tags:
  - taxanotes
  - 'Drupal 7'
source:
  plugin: scratchpads_d7_menu_link
  menu_name: main-menu
  node_types:
    - page
    - blog
  paths:
    blog: /blog
  track_changes: true
  constants:
    bundle: menu_link_content
    menu_name: main
    node_uri_format: 'entity:node/%d'
process:
  bundle: constants/bundle
  langcode:
    plugin: default_value
    default_value: en
  title: link_title
  menu_name: constants/menu_name
  # The migrated node of a node link (NULL for a path link: the lookup of an
  # empty uuid stops the pipeline).
  _nid:
    plugin: migration_lookup
    migration:
      - taxanotes_d7_page
      - taxanotes_d7_blog
    source: node_uuid
    no_stub: true
  # A node link whose node is not in the instance has neither: skipped.
  _target:
    -
      plugin: null_coalesce
      source:
        - path_uri
        - '@_nid'
    -
      plugin: skip_on_empty
      method: row
      message: 'The node of this link was not migrated'
  _node_uri:
    plugin: callback
    callable: sprintf
    unpack_source: true
    source:
      - constants/node_uri_format
      - '@_nid'
  'link/uri':
    plugin: null_coalesce
    source:
      - path_uri
      - '@_node_uri'
  weight: menu_weight
  expanded: expanded
  enabled: enabled
destination:
  plugin: 'entity:menu_link_content'
  default_bundle: menu_link_content
  no_stub: true
migration_dependencies:
  required:
    - taxanotes_d7_page
    - taxanotes_d7_blog
  optional: {  }
