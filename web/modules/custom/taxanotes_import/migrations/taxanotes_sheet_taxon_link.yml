id: taxanotes_sheet_taxon_link
label: 'Scratchpads taxonomy importer sheet: link parent and accepted name'
migration_group: taxanotes
migration_tags:
  - taxanotes
  - sheet
source:
  plugin: scratchpads_sheet
  track_changes: true
  constants:
    log_prefix: 'Imported from sheet '
    row_infix: ' row '
  # The first pass reports the identity notes; the same rows need not twice.
  identity_messages: false
process:
  # The log of the revision a changed link adds to a node whose current
  # revision is real history (destination-only, see below).
  sync_revision_log:
    plugin: concat
    source:
      - constants/log_prefix
      - sheet
      - constants/row_infix
      - row
  # The node the first pass created or updated for this row; a row without
  # one (it failed there) is skipped.
  nid:
    -
      plugin: taxanotes_guid_lookup
      source: guid
      migrations:
        - taxanotes_sheet_taxon
        - taxanotes_d7_taxon
      entity_type: node
      bundle: taxon
      field: field_guid
    -
      plugin: skip_on_empty
      method: row
      message: 'Taxon node not found for GUID'
  # The parent and the accepted name by GUID: a row of this sheet, a taxon
  # the D7 track imported, or one that carries the GUID in field_guid. A
  # GUID none of them knows leaves the field empty and records a message.
  field_parent_taxon_reference:
    -
      plugin: skip_on_empty
      method: process
      source: parent_guid
    -
      plugin: taxanotes_guid_lookup
      migrations:
        - taxanotes_sheet_taxon
        - taxanotes_d7_taxon
      entity_type: node
      bundle: taxon
      field: field_guid
      message: 'row @row (@name): parent GUID @value is not in the sheet nor on the site; parent left empty'
  field_accepted_name:
    -
      plugin: skip_on_empty
      method: process
      source: accepted_guid
    -
      plugin: taxanotes_guid_lookup
      migrations:
        - taxanotes_sheet_taxon
        - taxanotes_d7_taxon
      entity_type: node
      bundle: taxon
      field: field_guid
      message: 'row @row (@name): accepted name GUID @value is not in the sheet nor on the site; accepted name left empty'
destination:
  # The real-history rule of the first pass (taxanotes_entity_node), on the
  # listed fields only: a link that already holds the row's value saves
  # nothing; a changed link lands in the revision this sheet import made
  # ("Imported from sheet ..." is a placeholder for this pass: the first
  # pass's revision of this run, or an earlier sheet's) or in a D7
  # placeholder; on any other revision (a D7 revision, an edit made on the
  # site, e.g. a taxon re-parented by hand) it becomes a new revision logged
  # "Imported from sheet <file> row N", so every sheet change stays visible
  # in the history.
  plugin: taxanotes_entity_node
  entity_type: node
  default_bundle: taxon
  overwrite_properties:
    - field_parent_taxon_reference
    - field_accepted_name
  placeholder_log_prefixes:
    - 'Imported from sheet '
    - 'Migrated from Scratchpads GUID '
    - 'Synced from Scratchpads GUID '
    - 'Scratchpads revision history rolled back'
  sync_uid: 1
migration_dependencies:
  required:
    - taxanotes_sheet_taxon
  optional: {  }
