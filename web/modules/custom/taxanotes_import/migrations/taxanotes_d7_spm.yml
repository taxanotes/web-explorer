# Generated from the SPM section list (one text_long per Scratchpads SPM
# section, D7 field names kept); the recipe taxanotes_species defines the
# same fields. The migration id is the node uuid, which the D11 node also
# carries. Revisions of SPM nodes are not migrated (the D7 nodes have them;
# each page arrives as one revision). The text format follows the D7 one
# (filtered_html -> basic_html, full_html -> full_html, else basic_html).
# The source plugin picks, per field, the row set in the node's own language,
# else `und`, else the first language (the rule of the other node sources).
id: taxanotes_d7_spm
label: 'Scratchpads (Drupal 7) taxon descriptions (SPM nodes) to species pages'
migration_group: taxanotes
migration_tags:
  - taxanotes
  - 'Drupal 7'
source:
  plugin: scratchpads_d7_spm
  track_changes: true
process:
  type:
    plugin: default_value
    default_value: taxon_description
  langcode:
    plugin: default_value
    default_value: en
  uuid: uuid
  title: title
  uid:
    plugin: default_value
    default_value: 1
  status: status
  created: created
  changed: changed
  field_taxonomic_name:
    -
      plugin: migration_lookup
      migration: taxanotes_d7_taxon
      source: taxon_guid
      no_stub: true
    -
      plugin: skip_on_empty
      method: row
      message: 'The taxon of this page is not in the instance (not migrated, or a term of another vocabulary)'
  field_media:
    plugin: sub_process
    source: media
    process:
      target_id:
        plugin: migration_lookup
        migration: taxanotes_d7_media_image
        source: fid
        no_stub: true
  field_general_description/value:
    plugin: skip_on_empty
    method: process
    source: field_general_description_value
  field_general_description/format:
    plugin: static_map
    source: field_general_description_format
    map:
      filtered_html: basic_html
      full_html: full_html
      plain_text: plain_text
    default_value: basic_html
  field_biology/value:
    plugin: skip_on_empty
    method: process
    source: field_biology_value
  field_biology/format:
    plugin: static_map
    source: field_biology_format
