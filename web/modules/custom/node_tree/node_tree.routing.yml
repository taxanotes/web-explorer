# The two tree page routes get their path from node_tree.settings:path
# (Routing\RouteSubscriber); the paths here are the defaults.
node_tree.page:
  path: '/node-tree'
  defaults:
    _controller: 'Drupal\node_tree\Controller\NodeTreeController::page'
    _title_callback: 'Drupal\node_tree\Controller\NodeTreeController::title'
  requirements:
    _permission: 'access content'
node_tree.page_node:
  path: '/node-tree/node/{id}'
  defaults:
    _controller: 'Drupal\node_tree\Controller\NodeTreeController::page'
    _title_callback: 'Drupal\node_tree\Controller\NodeTreeController::title'
  requirements:
    _permission: 'access content'
node_tree.json_node_tree_api:
  path: '/node_tree/api/getImmediateChildrenOfParent'
  defaults:
    _controller: 'Drupal\node_tree\Controller\NodeTreeController::responseForImmediateChildrenOfParent'
  methods: [GET]
  requirements:
    _permission: 'access content'
node_tree.api_node_tree_content_display:
  path: '/node_tree/api/getNodeTreeContent/{id}'
  defaults:
    _controller: 'Drupal\node_tree\Controller\NodeTreeController::responseForGetNodeContent'
    id: ''
  methods: [GET]
  requirements:
    _permission: 'access content'
node_tree.api_get_expanded_tree:
  path: '/node_tree/api/getExpandedTreePathToNode/{id}'
  defaults:
    _controller: 'Drupal\node_tree\Controller\NodeTreeController::getExpandedTreePathToNode'
    id: ''
  methods: [GET]
  requirements:
    _permission: 'access content'
node_tree.settings:
  path: '/admin/config/content/node-tree'
  defaults:
    _form: 'Drupal\node_tree\Form\SettingsForm'
    _title: 'Node tree'
  requirements:
    _permission: 'administer node_tree'
