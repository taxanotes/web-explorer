front_intro: '<p>This site is a collaborative taxonomic database: a classification you can browse, a page for every name, and the literature behind each description.</p>'
about_title: About
about_body: '<p>This site runs on Taxanotes, an open platform for taxonomic websites that carries on from the Scratchpads. Each name in the classification has its own page with its rank, status, parent and synonyms, vernacular names and the reference that published it.</p>'
