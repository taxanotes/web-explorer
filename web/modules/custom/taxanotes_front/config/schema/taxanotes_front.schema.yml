taxanotes_front.settings:
  type: config_object
  label: 'Taxanotes front page settings'
  mapping:
    front_title:
      type: label
      label: 'Front page title (empty: "Welcome to <site name>")'
    front_intro:
      type: text
      label: 'Front page introduction (HTML)'
    about_title:
      type: label
      label: 'About page title'
    about_body:
      type: text
      label: 'About page body (HTML)'
    footer_text:
      type: text
      label: 'Footer text (HTML)'
    footer_credit:
      type: boolean
      label: 'End the footer logos row with the Taxanotes mark linked to taxanotes.org'
    footer_logos:
      type: sequence
      label: 'Footer logos (the instance scripts fill this from assets/footer/)'
      sequence:
        type: mapping
        label: 'Logo'
        mapping:
          file:
            type: string
            label: 'Path of the image under the public files directory (png or svg)'
          url:
            type: string
            label: 'Link (optional)'
          alt:
            type: label
            label: 'Alternative text'

block.settings.taxanotes_front_text:
  type: block_settings
  label: 'Instance text block'
  mapping:
    text_key:
      type: string
      label: 'Which text of taxanotes_front.settings to show'

block.settings.taxanotes_front_search:
  type: block_settings
  label: 'Taxon search block'

block.settings.taxanotes_front_summary:
  type: block_settings
  label: 'Taxon summary block'

block.settings.taxanotes_front_header_search:
  type: block_settings
  label: 'Header search block'

block.settings.taxanotes_front_recent:
  type: block_settings
  label: 'Recent content columns block'
  mapping:
    node_type:
      type: string
      label: 'Node type of the first column (page when absent)'
    items:
      type: integer
      label: 'Items per column'

block.settings.taxanotes_taxon_nomenclature:
  type: block_settings
  label: 'Nomenclature block'

block.settings.taxanotes_front_footer_logos:
  type: block_settings
  label: 'Footer logos block'
