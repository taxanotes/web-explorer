taxanotes_front.front:
  path: '/front'
  defaults:
    _controller: '\Drupal\taxanotes_front\Controller\FrontController::front'
    _title_callback: '\Drupal\taxanotes_front\Controller\FrontController::frontTitle'
  requirements:
    # A public page: the texts are the site's own, shown to everyone.
    _access: 'TRUE'

taxanotes_front.about:
  path: '/about'
  defaults:
    _controller: '\Drupal\taxanotes_front\Controller\FrontController::about'
    _title_callback: '\Drupal\taxanotes_front\Controller\FrontController::aboutTitle'
  requirements:
    # A public page: the texts are the site's own, shown to everyone.
    _access: 'TRUE'

taxanotes_front.settings:
  path: '/admin/config/system/taxanotes-front'
  defaults:
    _form: '\Drupal\taxanotes_front\Form\SettingsForm'
    _title: 'Front page and site texts'
  requirements:
    _permission: 'administer site configuration'

# The header search (block taxanotes_front_header_search): "Taxonomy" is
# redirected to the taxa list, "All" renders a results page across taxa,
# literature, species pages and pages.
taxanotes_front.search:
  path: '/find'
  defaults:
    _controller: '\Drupal\taxanotes_front\Controller\SearchController::find'
    _title_callback: '\Drupal\taxanotes_front\Controller\SearchController::title'
  requirements:
    # A public page: the texts are the site's own, shown to everyone.
    _access: 'TRUE'
