# Instance definition: Mormyrids (the Scratchpad of African weakly electric
# fishes, mormyrids.taxanotes.net). Committed, no secrets: credentials are in
# .env next to it (see instances/.env.example). Schema: instances/README.md.
slug: mormyrids
site:
  name: 'Mormyridae - African weakly electric fishes'
  slogan: 'Mintotom mi ne vé ?'
  # The classic view (web/themes/custom/taxanotes_classic): the Scratchpads
  # front end; olivero is the alternative. colour: the accent colour, six hex
  # digits (the Drupal 7 site's custom scratchpads_colour, its brown).
  theme: taxanotes_classic
  colour: '9F8247'
  # The first front page column listed the blog on the Drupal 7 site
  # (front_page_block_1_node_type: blog): the blog posts (blog_post).
  front_first_column: blog_post
  admin_theme: claro
  # Front page, About page and footer texts (HTML), seeded through the
  # taxanotes_front recipe; see instances/README.md. The welcome text is the
  # Drupal 7 site's own (front_page_welcome_* variables).
  front_title: 'Welcome, mormyrophile!'
  front_intro: |
    <p><strong>Looking for information on mormyrid fishes?</strong> You're in the right place. Here you'll find a classification reflecting the most recent published changes to mormyrid taxonomy, a page for each mormyrid genus and species, and a bibliography of original species descriptions and other important works on mormyrids. The photographs of type specimens and the electric organ discharge waveforms (EOD) follow with later migrations. We hope this site is useful to the specialist and general public alike. Have something to contribute? Say hello and request an account at the login link (upper right). This is an ongoing labor of love. Check back often to see what's been added.</p>
    <p><strong>How to use this site:</strong> Use the search box if you know the name of the taxon you're looking for, or start from the classification tree.</p>
  about_body: |
    <p>A Scratchpad of the African weakly electric fishes (Mormyridae): a classification reflecting the most recent published changes to mormyrid taxonomy, with a page for each genus and species.</p>
    <p>This is the Taxanotes (Drupal 11) edition of the site: the classification, its names and their revision history, the literature and the species pages have been carried over from the Scratchpads site; the pages, media and biographies follow with later migrations.</p>
  # The licence is the Drupal 7 site's (creative_commons_block_licence_type:
  # CC BY-SA), as its footer states it.
  footer_text: |
    <p>Except where otherwise noted, content on this site is licensed under a <a href="https://creativecommons.org/licenses/by-sa/4.0/">Creative Commons Attribution, Share Alike (CC BY-SA) licence</a>. Originally built on <a href="https://scratchpads.org/">Scratchpads</a>, a Natural History Museum (London) platform.</p>
# Hostnames per environment; the first of each list is the canonical URL.
# ddev: served by this checkout's ddev project (multisite, web/sites/sites.php).
# production: one checkout per instance (see instances/README.md).
hostnames:
  ddev:
    - mormyrids.taxanotes-dev.ddev.site
  production:
    - mormyrids.taxanotes.net
drupal:
  # web/sites/<sites_subdir> (default: slug); mapped from the ddev hostnames
  # in web/sites/sites.php.
  sites_subdir: mormyrids
  profile: standard
  # Database name per environment: its own database in the ddev db container,
  # the hosting toolkit's d<slug>_1 on the server.
  database:
    ddev: mormyrids
    production: dmormyrids_1
source:
  type: scratchpads_d7
  # D7 vocabulary machine name of the taxa, and the D7 database holding it
  # (per environment: the local Scratchpads stack; s_<slug> on the server).
  vocabulary: mormyridae
  database:
    ddev: mormyrids
    production: s_mormyrids
  # Root terms whose subtree is imported unpublished (Scratchpads convention).
  unpublished_roots:
    - 'Deleted taxa'
