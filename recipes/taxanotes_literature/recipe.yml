name: 'Taxanotes literature'
description: 'Gives a Taxanotes instance its literature: bibcite references (with contributors and keywords) linked to the taxa they cite, as in Scratchpads. On the reference: field_taxonomic_name (the taxa, unlimited), field_file (attachments), field_scratchpads_uuid (the Scratchpads node uuid the import keys on) and field_scratchpads_nid (the Scratchpads nid, which the inline citations in texts cite), on the 14 publication types the pilot sites use. On the basic_html text format: the Scratchpads inline citation filter ([bib]nid[/bib] becomes a numbered link to the reference, with the cited references listed under the text). On the taxon: field_reference, the protologue as a link to the reference entity (its Scratchpads nid/title/GUID stay in the shadow fields). A Literature page (/literature, in the main menu) with filters, a Literature block on the taxon page (the references that name it) and a "Recently added literature" block on the front page. Applied by taxanotes_base; nothing here names an instance. Re-applying changes nothing that is already in place (blocks and the view are created only when missing).'
type: 'Site'
recipes:
  - taxanotes_taxon
  - taxanotes_users
install:
  - bibcite
  - bibcite_entity
  - bibcite_export
  - bibcite_bibtex
  - bibcite_ris
  - block
  - file
  - views
  - taxanotes_literature
config:
  # A recipe installs a module's simple configuration only; its config
  # entities (bibcite's reference types, contributor roles and categories,
  # form and view displays, the administration views) come in through this
  # import list, as the taxon recipe imports the node view modes.
  import:
    bibcite: '*'
    bibcite_entity: '*'
    bibcite_export: '*'
    bibcite_bibtex: '*'
    bibcite_ris: '*'
    file: '*'
  strict:
    # Field storages influence the database layout, so they must match exactly.
    - field.storage.bibcite_reference.field_file
    - field.storage.bibcite_reference.field_scratchpads_nid
    - field.storage.bibcite_reference.field_scratchpads_uuid
    - field.storage.bibcite_reference.field_taxonomic_name
    - field.storage.node.field_designation_reference
    - field.storage.node.field_reference
    - field.storage.node.field_synonymy_reference
  actions:
    # The Scratchpads inline citations ([bib]nid[/bib], the biblio filter
    # markup) in the migrated texts, rendered by the filter of
    # taxanotes_literature. On basic_html, the format the migrations give the
    # Scratchpads filtered_html texts; after filter_html (weight -10), so the
    # link and list it adds are not stripped. Set on every apply.
    filter.format.basic_html:
      setFilterConfig:
        instance_id: taxanotes_citation
        configuration:
          id: taxanotes_citation
          provider: taxanotes_literature
          status: true
          weight: 10
          settings: {  }
    # The contributor name bibcite shows (and the author autocomplete matches)
    # is composed from the name parts; Scratchpads stores the middle initials
    # as a part too ("Régia Mayane Pacheco Fonseca"), so they are in the
    # pattern. Set on every apply (a site that changes it keeps its value
    # until the next apply).
    bibcite_entity.contributor.settings:
      simpleConfigUpdate:
        full_name_pattern: '@prefix @first_name @middle_name @last_name @suffix'
    # The reference page renders the default display (below: the citation
    # line, then the labelled rows), not bibcite's two-column table of every
    # field. Set on every apply.
    bibcite_entity.reference.settings:
      simpleConfigUpdate:
        display_override.reference_page_view_mode: default
    # Everyone reads the literature; the list formatter shows an author only
    # when the contributor entity is viewable, hence the three permissions.
    user.role.anonymous:
      grantPermissions:
        - 'view bibcite_reference'
        - 'view bibcite_contributor'
        - 'view bibcite_keyword'
    user.role.authenticated:
      grantPermissions:
        - 'view bibcite_reference'
        - 'view bibcite_contributor'
        - 'view bibcite_keyword'
    # Editing follows the taxon roles (recipes/taxanotes_users): a
    # contributor adds references and edits their own, an editor any.
    user.role.contributor:
      grantPermissions:
        - 'create bibcite_reference'
        - 'edit own bibcite_reference'
        - 'delete own bibcite_reference'
        - 'create bibcite_contributor'
        - 'create bibcite_keyword'
    user.role.editor:
      grantPermissions:
        - 'create bibcite_reference'
        - 'edit any bibcite_reference'
        - 'delete any bibcite_reference'
        - 'view all bibcite_reference revisions'
        - 'revert all bibcite_reference revisions'
        - 'create bibcite_contributor'
        - 'edit bibcite_contributor'
        - 'delete bibcite_contributor'
        - 'create bibcite_keyword'
        - 'edit bibcite_keyword'
        - 'delete bibcite_keyword'
    # The taxon page: the protologue as a link to the reference entity, where
    # the taxon recipe shows the reference title text (the shadow field,
    # hidden here; it keeps the Scratchpads value for taxa whose reference
    # did not resolve).
    # The synonymy and designation references (the nomenclature fields of
    # the taxon that point at a literature entry, see the taxon recipe) are
    # rendered by the Nomenclature block, like the other nomenclature fields.
    core.entity_view_display.node.taxon.default:
      setComponents:
        - name: field_reference
          options: { type: entity_reference_label, label: inline, weight: 11, region: content, settings: { link: true }, third_party_settings: {  } }
      hideComponents:
        - field_reference_title
        - field_synonymy_reference
        - field_designation_reference
    core.entity_form_display.node.taxon.default:
      setComponents:
        - name: field_reference
          options: { type: entity_reference_autocomplete, weight: 12, region: content, settings: { match_operator: CONTAINS, match_limit: 10, size: 60, placeholder: '' }, third_party_settings: {  } }
        - name: field_synonymy_reference
          options: { type: entity_reference_autocomplete, weight: 47, region: content, settings: { match_operator: CONTAINS, match_limit: 10, size: 60, placeholder: '' }, third_party_settings: {  } }
        - name: field_designation_reference
          options: { type: entity_reference_autocomplete, weight: 50, region: content, settings: { match_operator: CONTAINS, match_limit: 10, size: 60, placeholder: '' }, third_party_settings: {  } }
    # Blocks (default theme; Olivero regions, "content" elsewhere), created
    # only when missing like the front recipe's: the references naming the
    # taxon under the taxon's fields, the newest references on the front page.
    block.block.taxanotes_taxon_literature:
      placeBlockInDefaultTheme:
        plugin: 'views_block:taxanotes_literature-taxon'
        region:
          olivero: content
          taxanotes_classic: content
        default_region: content
        weight: 20
        settings:
          id: 'views_block:taxanotes_literature-taxon'
          label: ''
          label_display: visible
          provider: views
          views_label: ''
          items_per_page: none
        visibility:
          entity_bundle:node:
            id: 'entity_bundle:node'
            negate: false
            context_mapping:
              node: '@node.node_route_context:node'
            bundles:
              taxon: taxon
    block.block.taxanotes_front_recent_literature:
      placeBlockInDefaultTheme:
        plugin: 'views_block:taxanotes_literature-recent'
        region:
          olivero: content_below
          taxanotes_classic: content_below
        default_region: content
        weight: 2
        settings:
          id: 'views_block:taxanotes_literature-recent'
          label: ''
          label_display: visible
          provider: views
          views_label: ''
          items_per_page: none
        visibility:
          request_path:
            id: request_path
            negate: false
            pages: '<front>'
    # The reference forms and pages of the 14 types: the taxa (tags
    # autocomplete) and the attachments; the Scratchpads uuid stays off the
    # form and the page. bibcite installs a form display and the default and
    # table view displays per type (the reference page uses "table").
    core.entity_form_display.bibcite_reference.book.default:
      setComponents:
        -
          name: field_taxonomic_name
          options:
            type: entity_reference_autocomplete_tags
            weight: 4
            region: content
            settings:
              match_operator: CONTAINS
              match_limit: 10
              size: 60
              placeholder: ''
            third_party_settings: {  }
        -
          name: field_file
          options:
            type: file_generic
            weight: 5
            region: content
            settings:
              progress_indicator: throbber
            third_party_settings: {  }
    # The reference page as the Scratchpads biblio node read: the citation
    # line first (bibcite's citation pseudo-field, in the site's citation
    # style), then the abstract, the keywords, the taxa, the attachment, the
    # DOI, the URL and the notes as labelled rows, and the export links;
    # every bibliographic field the citation already carries is hidden. Set
    # on every apply, on each of the 14 publication types (the table
    # display keeps the taxa and the attachment only).
    core.entity_view_display.bibcite_reference.book.default:
      setComponents:
        - name: citation
          options: { weight: 0, region: content, settings: {  }, third_party_settings: {  } }
        - name: bibcite_abst_e
          options: { type: basic_string, label: inline, weight: 1, region: content, settings: {  }, third_party_settings: {  } }
        - name: keywords
          options: { type: entity_reference_label, label: inline, weight: 2, region: content, settings: { link: true }, third_party_settings: {  } }
        - name: field_taxonomic_name
          options: { type: entity_reference_label, label: inline, weight: 3, region: content, settings: { link: true }, third_party_settings: {  } }
        - name: field_file
          options: { type: file_default, label: inline, weight: 4, region: content, settings: { use_description_as_link_text: true }, third_party_settings: {  } }
        - name: bibcite_doi
          options: { type: string, label: inline, weight: 5, region: content, settings: { link_to_entity: false }, third_party_settings: {  } }
        - name: bibcite_url
          options: { type: string, label: inline, weight: 6, region: content, settings: { link_to_entity: false }, third_party_settings: {  } }
        - name: bibcite_notes
          options: { type: basic_string, label: inline, weight: 7, region: content, settings: {  }, third_party_settings: {  } }
        - name: bibcite_links
          options: { weight: 8, region: content, settings: {  }, third_party_settings: {  } }
      hideComponents:
        - author
        - bibcite_year
        - bibcite_secondary_title
        - bibcite_volume
        - bibcite_issue
