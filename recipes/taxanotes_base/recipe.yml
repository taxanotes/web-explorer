name: 'Taxanotes base'
description: 'Turns a freshly installed Drupal site into a Taxanotes instance: the shared taxon content type and editing roles (through the taxanotes_taxon and taxanotes_users recipes), the literature (bibcite references linked to taxa, through taxanotes_literature), the species pages and images (through taxanotes_species), the pages and blog posts (through taxanotes_pages), the taxon tree (node_tree), the Scratchpads import track (taxanotes_import with the migrate tooling) and the site identity. Name, slogan and mail are the only per-instance values and arrive as recipe inputs, which scripts/new-instance.sh fills from instances/<slug>/instance.yml; nothing in this recipe names an instance.'
type: 'Site'
recipes:
  - taxanotes_taxon
  - taxanotes_users
  - taxanotes_literature
  - taxanotes_species
  - taxanotes_pages
install:
  - migrate
  - migrate_plus
  - migrate_tools
  - node_tree
  - taxanotes_import
  - update
input:
  site_name:
    data_type: string
    description: 'The site name (system.site:name), shown in the page title and branding.'
    constraints:
      NotBlank: {}
    form:
      '#type': textfield
      '#title': 'Site name'
    default:
      source: config
      config: ['system.site', 'name']
      fallback: 'Taxanotes'
  site_slogan:
    data_type: string
    description: 'The site slogan (system.site:slogan); may be empty.'
    form:
      '#type': textfield
      '#title': 'Site slogan'
    default:
      source: config
      config: ['system.site', 'slogan']
      fallback: ''
  site_mail:
    data_type: email
    description: 'The address automated site mail is sent from (system.site:mail).'
    constraints:
      NotBlank: {}
    form:
      '#type': email
      '#title': 'Site email address'
    default:
      source: config
      config: ['system.site', 'mail']
      fallback: 'webmaster@example.com'
config:
  actions:
    system.site:
      simpleConfigUpdate:
        name: ${site_name}
        slogan: ${site_slogan}
        mail: ${site_mail}
    # Updates reach an instance as releases (scripts/hosting/new-instance.sh),
    # so the site mails nobody about them: the Update module still reports on
    # /admin/reports/updates, and cron no longer tries to send a notice
    # (which fails on a host without a mailer). `drush config:set
    # update.settings notification.emails` re-enables the mail.
    update.settings:
      simpleConfigUpdate:
        notification.emails: []
    # The Scratchpads filtered_html format turned bare web addresses into
    # links (filter_url); basic_html, the format the migrations give those
    # texts, does the same, after filter_html (-10) and before the citation
    # filter (10). Set on every apply.
    filter.format.basic_html:
      setFilterConfig:
        instance_id: filter_url
        configuration:
          id: filter_url
          provider: filter
          status: true
          weight: 0
          settings:
            filter_url_length: 72
    # Composition of taxon + literature on the taxon page: the protologue is
    # the link to the reference entity (taxanotes_literature), not the
    # Scratchpads title text (taxanotes_taxon). Both sub-recipes set this
    # display in their own actions; applied as one chain the taxon recipe's
    # text won (seen on a fresh build), so the composed result is set here,
    # after every sub-recipe, where it cannot be overtaken.
    core.entity_view_display.node.taxon.default:
      setComponents:
        - name: field_reference
          options: { type: entity_reference_label, label: inline, weight: 11, region: content, settings: { link: true }, third_party_settings: {  } }
      hideComponents:
        - field_reference_title
